/* Eine Stelle fuers Blaettern — Tasten, Wischen und die Seitenwender-Knoepfe
   benutzen alle diese Funktion. dir: 1 = weiter, -1 = zurueck. */
async function blaettern(dir){
  if(!state.book)return;
  /* Kapitel-Uebersicht eines Buchs: seitwaerts = voriges / naechstes Buch */
  if(state.passageId===null){nachbarBuch(dir);return;}
  try{
    const data=await loadBook(state.book,effectiveLang(state.book));
    const idx=data.pericopes.findIndex(x=>x.id===state.passageId);
    const target=dir>0?data.pericopes[idx+1]:data.pericopes[idx-1];
    if(target){go(state.book,target.id);return;}
    // at a book boundary → cross into the neighbouring book
    const bi=BOOKS.findIndex(b=>b.s===state.book);
    if(dir>0&&bi<BOOKS.length-1){
      const nb=BOOKS[bi+1];
      const nd=await loadBook(nb.s,effectiveLang(nb.s));
      if(nd.pericopes.length)go(nb.s,nd.pericopes[0].id);
    }else if(dir<0&&bi>0){
      const pb=BOOKS[bi-1];
      const pd=await loadBook(pb.s,effectiveLang(pb.s));
      if(pd.pericopes.length)go(pb.s,pd.pericopes[pd.pericopes.length-1].id);
    }
  }catch(_){}
}
/* ── Seitenwender: dieselbe blaettern()-Funktion, nur sichtbar ──────────────
   Sie zeigen sich, sobald ein Buch offen ist, und werden blass am Anfang bzw.
   Ende der ganzen Schrift. In der Suche verschwinden sie. */
const _wPrev=document.getElementById('wenderPrev');
const _wNext=document.getElementById('wenderNext');
_wPrev.addEventListener('click',()=>blaettern(-1));
_wNext.addEventListener('click',()=>blaettern(1));
async function wenderAktualisieren(){
  const de=state.lang==='de';
  _wPrev.setAttribute('aria-label',de?'Vorherige Stelle':'Previous passage');
  _wNext.setAttribute('aria-label',de?'Nächste Stelle':'Next passage');
  _wPrev.title=_wPrev.getAttribute('aria-label');
  _wNext.title=_wNext.getAttribute('aria-label');
  /* Auf der Startseite gibt es nichts zu wenden */
  const zeigen=!!state.book&&!overlay.classList.contains('open');
  _wPrev.classList.toggle('aus',!zeigen);
  _wNext.classList.toggle('aus',!zeigen);
  /* dunkles Glas, sobald ein Gemaelde hinter der Schrift liegt */
  document.body.classList.toggle('lesend-bild',main.classList.contains('has-bg'));
  if(!zeigen)return;
  /* Anfang / Ende der Schrift: Genesis 1,1 zurueck und Offenbarung 22 vorwaerts
     fuehren nirgendwohin — der Knopf wird blass statt ins Leere zu klicken. */
  const bi=BOOKS.findIndex(b=>b.s===state.book);
  let ersteStelle=false,letzteStelle=false;
  if(state.passageId!==null){
    try{
      const data=await loadBook(state.book,effectiveLang(state.book));
      const idx=data.pericopes.findIndex(x=>x.id===state.passageId);
      ersteStelle=idx<=0;letzteStelle=idx>=data.pericopes.length-1;
    }catch(_){}
  }else{ersteStelle=true;letzteStelle=true;}
  _wPrev.disabled=(bi<=0&&ersteStelle);
  _wNext.disabled=(bi>=BOOKS.length-1&&letzteStelle);
}
window.wenderAktualisieren=wenderAktualisieren;   /* route() ruft es nach dem Rendern */
document.addEventListener('keydown',async e=>{
  const inInput=/input|textarea|select/i.test(document.activeElement.tagName);
  if(e.key==='/'&&!inInput){e.preventDefault();openSearch();return}
  if(e.key==='Escape'){
    if(overlay.classList.contains('open')){closeSearch();return}
    if(inInput){document.activeElement.blur();return}
  }
  if(inInput)return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  blaettern(e.key==='ArrowRight'?1:-1);
});

/* ============================================================
   SEARCH — overlay that dims the page
   ============================================================ */
const overlay=document.getElementById('search-overlay');
const searchInput=document.getElementById('search');
const srList=document.getElementById('sr-list');
const srCount=document.getElementById('sr-count');
const srProgress=document.getElementById('sr-progress');
const scopeAllInput=document.getElementById('scope-all');
const scopeLabel=document.getElementById('scope-label');
let searchTimer=null;

function openSearch(){
  overlay.classList.add('open');
  updateScopeLabel();
  wenderAktualisieren();   /* Wender weg, solange die Suche offen liegt */
  setTimeout(()=>searchInput.focus(),120);
}
function closeSearch(){
  overlay.classList.remove('open');
  searchInput.blur();
  wenderAktualisieren();
}
function updateScopeLabel(){
  const de=state.lang==='de';
  scopeLabel.textContent=de
    ?'Die ganze Bibel durchsuchen (alle 66 Bücher)'
    :'Search the entire Bible (all 66 books)';
  searchInput.placeholder=de?'Die Schrift durchsuchen…':'Search the Scriptures…';
  if(!searchInput.value.trim()){
    srList.innerHTML=`<div class="so-hint">${de?'Ein Wort, ein Name, eine Verheißung.':'Type a word, a name, a promise.'}</div>`;
    srCount.textContent='';
  }
}
document.getElementById('search-open').addEventListener('click',openSearch);
document.getElementById('search-close').addEventListener('click',closeSearch);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeSearch()});
scopeAllInput.addEventListener('change',()=>{
  state.searchAll=scopeAllInput.checked;
  runSearch(searchInput.value.trim());
});
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>runSearch(searchInput.value.trim()),260);
});
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){clearTimeout(searchTimer);runSearch(searchInput.value.trim())}
});

async function ensureAllBooks(progressCb){
  /* in der Sprache des Lesers suchen — Deutsch gibt es fuer alle Buecher */
  const lang=state.lang==='de'?'de':'en';
  const todo=BOOKS.filter(b=>!state.cache[`${lang}/${b.s}`]);
  let done=BOOKS.length-todo.length;
  const CHUNK=8;
  for(let i=0;i<todo.length;i+=CHUNK){
    await Promise.all(todo.slice(i,i+CHUNK).map(b=>
      loadBook(b.s,lang).catch(()=>null)
    ));
    done+=Math.min(CHUNK,todo.length-i);
    if(progressCb)progressCb(done,BOOKS.length);
  }
}
function highlight(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(text.slice(0,180))+(text.length>180?'…':'');
  const start=Math.max(0,i-70);
  const before=(start>0?'…':'')+text.slice(start,i);
  const hit=text.slice(i,i+q.length);
  const after=text.slice(i+q.length,i+q.length+110)+(i+q.length+110<text.length?'…':'');
  return esc(before)+'<mark>'+esc(hit)+'</mark>'+esc(after);
}
let searchToken=0;
async function runSearch(q){
  const de=state.lang==='de';
  const token=++searchToken;
  if(!q||q.length<2){
    srList.innerHTML=`<div class="so-hint">${de?'Ein Wort, ein Name, eine Verheißung.':'Type a word, a name, a promise.'}</div>`;
    srCount.textContent='';srProgress.textContent='';
    return;
  }
  const scopeAll=state.searchAll;
  if(scopeAll){
    srProgress.textContent=de?'Lade alle Bücher…':'Loading all books…';
    await ensureAllBooks((d,t)=>{if(token===searchToken)srProgress.textContent=(de?'Lade Bücher… ':'Loading books… ')+d+' / '+t});
    if(token!==searchToken)return;
    srProgress.textContent='';
  }else if(state.book){
    try{await loadBook(state.book,effectiveLang(state.book))}catch(_){}
    if(token!==searchToken)return;
  }
  const ql=q.toLowerCase();
  let results=[];
  const searchLang=state.lang==='de'?'de':'en';
  const scopeKeys=Object.keys(state.cache).filter(k=>{
    if(!scopeAll){return state.book&&k.endsWith('/'+state.book)&&k.startsWith(effectiveLang(state.book))}
    return k.startsWith(searchLang+'/');
  });
  const seen=new Set();
  for(const key of scopeKeys){
    const data=state.cache[key];
    if(seen.has(data.slug))continue;seen.add(data.slug);
    for(const p of data.pericopes){
      if(p.title.toLowerCase().includes(ql)||p.verses.toLowerCase().includes(ql)||p.text.toLowerCase().includes(ql)){
        results.push({book:data.slug,p});
        if(results.length>=200)break;
      }
    }
    if(results.length>=200)break;
  }
  /* Referenz-Treffer ("John 3:19" -> Stelle, die den Vers enthaelt) nach OBEN */
  const ref=parseRef(q);
  if(ref&&(scopeAll||ref.slug===state.book)){
    const data=state.cache[`${searchLang}/${ref.slug}`]||state.cache[`en/${ref.slug}`];
    if(data){
      const refHits=[];
      for(const p of data.pericopes){
        const r=pericopeRange(p);
        if(!r||r.chapter!==ref.chapter)continue;
        if(ref.verse===null||(ref.verse>=r.vs&&ref.verse<=r.ve))refHits.push({book:ref.slug,p});
      }
      const refKeys=new Set(refHits.map(r=>r.book+'/'+r.p.id));
      results=refHits.concat(results.filter(r=>!refKeys.has(r.book+'/'+r.p.id)));
    }
  }
  if(token!==searchToken)return;
  if(!scopeAll&&!state.book){
    srCount.textContent='';
    srList.innerHTML=`<div class="so-hint">${de
      ?'Wähle zuerst ein Buch — oder durchsuche die ganze Bibel.'
      :'Choose a book first — or search the entire Bible.'}</div>`;
    return;
  }
  srCount.textContent=results.length
    ?(de?`${results.length} Treffer${scopeAll?'':' in '+displayName(state.book)}`:`${results.length} result${results.length===1?'':'s'}${scopeAll?'':' in '+displayName(state.book)}`)
    :'';
  if(!results.length){
    srList.innerHTML=`<div class="sr-empty">${de?'Nichts gefunden. Versuche ein anderes Wort.':'Nothing found. Try another word.'}</div>`;
    return;
  }
  srList.innerHTML=results.map(r=>`
    <button type="button" class="sr-item" data-b="${r.book}" data-id="${r.p.id}">
      <div class="sr-ref">${esc(r.p.verses)}<small>${esc(displayName(r.book))}</small></div>
      <div class="sr-txt">${highlight(r.p.text,q)}</div>
    </button>`).join('');
  srList.querySelectorAll('.sr-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      closeSearch();
      searchInput.value='';
      go(btn.dataset.b,+btn.dataset.id);
    });
  });
}

/* ============================================================
   LANGUAGE TOGGLE
   ============================================================ */
const langEn=document.getElementById('lang-en');
const langDe=document.getElementById('lang-de');
function applyLangButtons(){
  langEn.classList.toggle('on',state.lang==='en');
  langDe.classList.toggle('on',state.lang==='de');
}
/* static chrome (topbar, sidebar headings, tooltips) follows the language */
function applyChrome(){
  const de=state.lang==='de';
  document.documentElement.lang=de?'de':'en';
  const T=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
  T('sb-sec-ot-t',de?'Altes Testament':'Old Testament');
  T('sb-sec-nt-t',de?'Neues Testament':'New Testament');
  T('search-lbl',de?'Die Schrift durchsuchen…':'Search the Scriptures…');
  document.getElementById('search-open').setAttribute('aria-label',de?'Die Schrift durchsuchen':'Search the Scriptures');
  const bm=document.getElementById('bm-open');
  bm.title=de?'Lesezeichen':'Bookmarks';
  bm.setAttribute('aria-label',de?'Lesezeichen':'Bookmarks');
  document.getElementById('sb-toggle').setAttribute('aria-label',de?'Bücherliste öffnen':'Open book list');
  const sbx=document.getElementById('sb-x');
  if(sbx)sbx.setAttribute('aria-label',de?'Bücherliste schließen':'Close book list');
  const th=document.getElementById('theme-toggle');
  if(th)th.title=de?'Hell / Dunkel umschalten':'Toggle light / dark mode';
  const brand=document.getElementById('tb-brand');
  if(brand)brand.title=de?'Zur Bibel — alle 66 Bücher':'To the Bible — all 66 books';
  if(state.passageId===null){
    tbTitle.textContent=de?'Die Bibel':'The Bible';
    document.title=de?'Die Bibel · TruthPrints Reader':'The Bible · TruthPrints Reader';
  }
}
async function setLang(lang){
  state.lang=lang;
  try{localStorage.setItem('tp-lang',lang)}catch(_){}
  applyLangButtons();
  applyChrome();
  updateScopeLabel();
  buildSidebar();
  if(state.book){
    sbEl(state.book)?.classList.add('active');
    await renderChapters(state.book);
  }
  if(state.passageId!==null&&state.book){
    try{
      const data=await loadBook(state.book,effectiveLang(state.book));
      const p=data.pericopes.find(x=>x.id===state.passageId)||data.pericopes[0];
      renderPassage(data,p);
      renderPassageList(data,p.chapter);
    }catch(e){renderError(state.book,e)}
  }else if(!overlay.classList.contains('open')){
    renderWelcome();
  }
  wenderAktualisieren();   /* Beschriftung der Seitenwender folgt der Sprache */
}
langEn.addEventListener('click',()=>setLang('en'));
langDe.addEventListener('click',()=>setLang('de'));
langDe.title='Deutsch — derzeit für Matthäus, Markus, Lukas, Johannes';

/* ============================================================
   MOBILE SIDEBAR — full-screen drawer with ✕
   ============================================================ */
const sidebar=document.getElementById('sidebar');
const sbToggle=document.getElementById('sb-toggle');
const sbX=document.getElementById('sb-x');
function closeMobileSidebar(){
  sidebar.classList.remove('open');
  sbToggle.setAttribute('aria-expanded','false');
}
sbToggle.addEventListener('click',()=>{
  if(window.innerWidth>920){
    /* Desktop: ein-/ausklappen (beim Lesen ist sie automatisch eingeklappt) */
    const collapsed=document.body.classList.toggle('sb-collapsed');
    sbToggle.setAttribute('aria-expanded',String(!collapsed));
    return;
  }
  const open=sidebar.classList.toggle('open');
  sbToggle.setAttribute('aria-expanded',open);
});
sbX.addEventListener('click',closeMobileSidebar);
/* Die Marke oben fuehrt zur Bibel-Uebersicht (die Kacheln), nicht mehr aus dem
   Reader hinaus — dorthin geht es unten in der Seitenleiste. */
const brandLink=document.getElementById('tb-brand');
if(brandLink)brandLink.addEventListener('click',e=>{
  e.preventDefault();
  closeMobileSidebar();
  if(location.hash&&location.hash!=='#')location.hash=''; else route();
});
window.addEventListener('hashchange',()=>{if(window.innerWidth<=920)closeMobileSidebar()});

/* ── mobil: horizontal wischen = naechste / vorherige Passage ── */
let _swX=0,_swY=0;
main.addEventListener('touchstart',e=>{const t=e.touches[0];_swX=t.clientX;_swY=t.clientY;},{passive:true});
main.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-_swX, dy=t.clientY-_swY;
  /* klarer horizontaler Wisch: weit genug, deutlich horizontaler als vertikal */
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
  /* Eine Stelle fuers Blaettern: dieselbe Funktion wie Tasten und Seitenwender.
     Sie kennt Kapitel-Uebersicht UND Buchgrenzen (letzte Perikope -> Nachbarbuch,
     statt ins Leere zu laufen — Leo 28.07.). */
  blaettern(dx<0?1:-1);
},{passive:true});

   INIT
   ============================================================ */
/* ── bookmarks panel ── */
(function(){
  const btn=document.getElementById('bm-open');if(!btn)return;
  let panel=null;
  function close(){if(panel){panel.remove();panel=null;}}
  btn.addEventListener('click',()=>{
    if(panel){close();return;}
    const de=state.lang==='de';
    const list=tpBookmarks();
    panel=document.createElement('div');panel.id='bm-panel';
    panel.innerHTML='<div class="bm-h">'+(de?'Lesezeichen':'Bookmarks')+'</div>'+
      (list.length?list.map(b=>'<button class="bm-i" data-b="'+b.book+'" data-id="'+b.id+'"><span class="bm-r">'+esc(b.ref)+'</span><small>'+esc(b.name)+'</small></button>').join('')
        :'<div class="bm-e">'+(de?'Noch keine. Tippe „Merken" bei einer Passage.':'None yet. Tap “Save” on a passage.')+'</div>');
    document.body.appendChild(panel);
    panel.querySelectorAll('.bm-i').forEach(it=>it.addEventListener('click',()=>{go(it.dataset.b,+it.dataset.id);close();}));
    setTimeout(()=>document.addEventListener('click',outside),0);
  });
  function outside(e){if(panel&&!panel.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){close();document.removeEventListener('click',outside);}}
})();

/* Testament-Überschriften auf/zu klappen (spart langes Scrollen zum NT) */
function wireSection(secId,listId){
  const sec=document.getElementById(secId),list=document.getElementById(listId);
  if(!sec||!list)return;
  const toggle=()=>{const open=sec.classList.toggle('open');list.classList.toggle('collapsed',!open);
    try{localStorage.setItem('tp-sec-'+secId,open?'1':'0')}catch(_){}};
  try{if(localStorage.getItem('tp-sec-'+secId)==='0'){sec.classList.remove('open');list.classList.add('collapsed');}}catch(_){}
  sec.addEventListener('click',toggle);
  sec.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
}
wireSection('sb-sec-ot','sb-ot');
wireSection('sb-sec-nt','sb-nt');

buildSidebar();
applyLangButtons();
applyChrome();
updateScopeLabel();
tpApplyFont();
tpApplyVers();
route();
</script>

(function(){

  function setTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    icon.innerHTML=t==='dark'
      ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      :'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
    try{localStorage.setItem('tp_theme',t)}catch(e){}
  }
  try{var s=localStorage.getItem('tp_theme');if(s==='dark'||s==='light')setTheme(s)}catch(e){}
  if(btn)btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme')||'light';
    setTheme(cur==='dark'?'light':'dark');
  });
})();
</script>
