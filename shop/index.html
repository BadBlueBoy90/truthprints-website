<!doctype html><html><head><meta charset="utf-8">
<script>/* tp-lang-from-url — siehe read/index.html. Sprache merken und den
   Query-String weiterreichen, damit die QR-Codes der gedruckten Baende auch
   nach der Weiterleitung in der richtigen Sprache landen. */
(function(){try{
  var m=/[?&]lang=(de|en)/i.exec(location.search);
  if(m){var l=m[1].toLowerCase();
    localStorage.setItem('tp-lang',l); localStorage.setItem('tp_lang',l);}
}catch(e){}
location.replace("../index.html"+location.search+"#shop");})();</script>
<meta http-equiv="refresh" content="0;url=../index.html#shop">
<title>TruthPrints</title></head><body></body></html>
